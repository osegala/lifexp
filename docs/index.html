<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Evrenthia</title>
  <style>
    :root { color-scheme: light; --text: #20252b; --muted: #515b65; --link: #175b8c; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #fff; color: var(--text); font: 1rem/1.7 system-ui, sans-serif; }
    main { max-width: 48rem; margin: 0 auto; padding: clamp(2rem, 6vw, 4rem) 1.25rem; }
    h1 { margin: 0; font-size: clamp(2rem, 5vw, 2.75rem); line-height: 1.2; }
    p { color: var(--muted); }
    a { display: inline-flex; align-items: center; min-height: 2.75rem; color: var(--link); text-underline-offset: 0.2em; }
    a:focus-visible { outline: 2px solid var(--link); outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <h1>Evrenthia</h1>
    <p>Gamify your progress.</p>
    <nav aria-label="Legal">
      <a href="/lifexp/privacy/">Privacy Policy</a>
    </nav>
  </main>
</body>
</html>
