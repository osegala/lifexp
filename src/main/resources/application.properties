spring.application.name=productivity
spring.config.import=optional:file:./.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/productivity}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=604800000

# Creating a test account requires both the dev profile and an explicit opt-in.
app.dev.seed-test-account=${DEV_SEED_TEST_ACCOUNT:false}
app.dev.test-account-password=${DEV_TEST_ACCOUNT_PASSWORD:}
