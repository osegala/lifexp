  DeleteAccountFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: "${FunctionNamePrefix}-DeleteAccount"
      CodeUri: functions/delete-account/
      Handler: index.handler
      Description: Deletes the authenticated player's application data and Cognito identity.
      Timeout: 30
      Environment:
        Variables:
          USER_POOL_ID:
            Ref: EvrenthiaDevUserPool
      Layers:
        - Ref: ApiSharedLayer
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:BatchWriteItem
                - dynamodb:Query
              Resource:
                Fn::GetAtt:
                  - EvrenthiaDevTable
                  - Arn
            - Effect: Allow
              Action:
                - cognito-idp:AdminDeleteUser
              Resource:
                Fn::GetAtt:
                  - EvrenthiaDevUserPool
                  - Arn
      Events:
        DeleteAccount:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: EvrenthiaDevApi
            Path: /me
            Method: DELETE
            Auth:
              Authorizer: EvrenthiaCognito

  # ----------------------------------------------------
  # LOW-COST ENVIRONMENT OBSERVABILITY
  # ----------------------------------------------------

  Api5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName:
        Fn::Sub: "${FunctionNamePrefix}-Api-5XX"
      AlarmDescription: Five or more HTTP API server errors within five minutes.
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions:
        - Name: ApiId
          Value:
            Ref: EvrenthiaDevApi
        - Name: Stage
          Value: "$default"
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  CompleteTaskErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName:
        Fn::Sub: "${FunctionNamePrefix}-CompleteTask-Errors"
      AlarmDescription: Three or more CompleteTask Lambda errors within five minutes.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value:
            Ref: CompleteTaskFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  PurchaseItemErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName:
        Fn::Sub: "${FunctionNamePrefix}-PurchaseItem-Errors"
      AlarmDescription: Three or more PurchaseItem Lambda errors within five minutes.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value:
            Ref: PurchaseItemFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  UpgradeBuildingErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName:
        Fn::Sub: "${FunctionNamePrefix}-UpgradeBuilding-Errors"
      AlarmDescription: Three or more UpgradeBuilding Lambda errors within five minutes.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value:
            Ref: UpgradeBuildingFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  NotificationWorkerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName:
        Fn::Sub: "${FunctionNamePrefix}-NotificationWorker-Errors"
      AlarmDescription: Three or more NotificationWorker Lambda errors within five minutes.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value:
            Ref: NotificationWorkerFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  CreateProfileErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName:
        Fn::Sub: "${FunctionNamePrefix}-CreateProfile-Errors"
      AlarmDescription: Three or more CreateProfile Lambda errors within five minutes.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value:
            Ref: CreateProfileFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  DynamoDbThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName:
        Fn::Sub: "${FunctionNamePrefix}-DynamoDB-ThrottledRequests"
      AlarmDescription: One or more on-demand DynamoDB requests throttled within five minutes.
      Namespace: AWS/DynamoDB
      MetricName: ThrottledRequests
      Dimensions:
        - Name: TableName
          Value:
            Ref: EvrenthiaDevTable
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  EvrenthiaDevDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName:
        Ref: FunctionNamePrefix
      DashboardBody:
        Fn::Sub: |
          {
            "widgets": [
              {
                "type": "metric",
                "x": 0,
                "y": 0,
                "width": 12,
                "height": 6,
                "properties": {
                  "title": "API traffic and errors",
                  "region": "${AWS::Region}",
                  "view": "timeSeries",
                  "period": 300,
                  "stat": "Sum",
                  "metrics": [
                    ["AWS/ApiGateway", "Count", "ApiId", "${EvrenthiaDevApi}", "Stage", "$default", {"label": "Requests"}],
                    [".", "4xx", ".", ".", ".", ".", {"label": "4xx"}],
                    [".", "5xx", ".", ".", ".", ".", {"label": "5xx"}]
                  ]
                }
              },
              {
                "type": "metric",
                "x": 12,
                "y": 0,
                "width": 12,
                "height": 6,
                "properties": {
                  "title": "Critical Lambda errors",
                  "region": "${AWS::Region}",
                  "view": "timeSeries",
                  "period": 300,
                  "stat": "Sum",
                  "metrics": [
                    ["AWS/Lambda", "Errors", "FunctionName", "${CompleteTaskFunction}", {"label": "CompleteTask"}],
                    [".", ".", ".", "${PurchaseItemFunction}", {"label": "PurchaseItem"}],
                    [".", ".", ".", "${UpgradeBuildingFunction}", {"label": "UpgradeBuilding"}],
                    [".", ".", ".", "${NotificationWorkerFunction}", {"label": "NotificationWorker"}]
                  ]
                }
              },
              {
                "type": "metric",
                "x": 0,
                "y": 6,
                "width": 12,
                "height": 6,
                "properties": {
                  "title": "NotificationWorker duration",
                  "region": "${AWS::Region}",
                  "view": "timeSeries",
                  "period": 300,
                  "stat": "Average",
                  "metrics": [
                    ["AWS/Lambda", "Duration", "FunctionName", "${NotificationWorkerFunction}", {"label": "Average duration"}]
                  ]
                }
              },
              {
                "type": "metric",
                "x": 12,
                "y": 6,
                "width": 12,
                "height": 6,
                "properties": {
                  "title": "DynamoDB throttles",
                  "region": "${AWS::Region}",
                  "view": "timeSeries",
                  "period": 300,
                  "stat": "Sum",
                  "metrics": [
                    ["AWS/DynamoDB", "ThrottledRequests", "TableName", "${EvrenthiaDevTable}", {"label": "Throttled requests"}]
                  ]
                }
              }
            ]
          }

  EvrenthiaDevBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName:
          Fn::Sub: "${FunctionNamePrefix}-Monthly-10-USD"
        BudgetLimit:
          Amount: 10
          Unit: USD
        BudgetType: COST
        TimeUnit: MONTHLY
      NotificationsWithSubscribers:
        Fn::If:
          - HasBudgetNotificationEmail
          - - Notification:
                ComparisonOperator: GREATER_THAN
                NotificationType: ACTUAL
                Threshold: 50
                ThresholdType: PERCENTAGE
              Subscribers:
                - Address:
                    Ref: BudgetNotificationEmail
                  SubscriptionType: EMAIL
            - Notification:
                ComparisonOperator: GREATER_THAN
                NotificationType: ACTUAL
                Threshold: 80
                ThresholdType: PERCENTAGE
              Subscribers:
                - Address:
                    Ref: BudgetNotificationEmail
                  SubscriptionType: EMAIL
            - Notification:
                ComparisonOperator: GREATER_THAN
                NotificationType: ACTUAL
                Threshold: 100
                ThresholdType: PERCENTAGE
              Subscribers:
                - Address:
                    Ref: BudgetNotificationEmail
                  SubscriptionType: EMAIL
          - Ref: AWS::NoValue

# ======================================================
# OUTPUTS
# ======================================================

Outputs:
  ApiUrl:
    Description: Evrenthia HTTP API URL

    Value:
      Fn::Sub: "https://${EvrenthiaDevApi}.execute-api.${AWS::Region}.amazonaws.com"

  TableName:
    Description: Managed DynamoDB table name
    Value:
      Ref: EvrenthiaDevTable

  UserPoolId:
    Description: Managed Cognito user pool ID
    Value:
      Ref: EvrenthiaDevUserPool

  UserPoolClientId:
    Description: Managed Cognito app client ID
    Value:
      Ref: EvrenthiaDevUserPoolClient

  NotificationDeliveryMode:
    Description: Configured notification delivery mode
    Value:
      Ref: PushDeliveryMode

  DevApiUrl:
    Description: Backward-compatible development tooling alias for ApiUrl
    Value:
      Fn::Sub: "https://${EvrenthiaDevApi}.execute-api.${AWS::Region}.amazonaws.com"

  DevTableName:
    Description: Backward-compatible development tooling alias for TableName
    Value:
      Ref: EvrenthiaDevTable

  DevUserPoolId:
    Description: Backward-compatible development tooling alias for UserPoolId
    Value:
      Ref: EvrenthiaDevUserPool

  DevUserPoolClientId:
    Description: Backward-compatible development tooling alias for UserPoolClientId
    Value:
      Ref: EvrenthiaDevUserPoolClient

  GetMeFunctionName:
    Description: GetMe Lambda function name

    Value:
      Ref: GetMeFunction

  CreateProfileFunctionArn:
    Description: CreateProfile Lambda ARN
    Value:
      Fn::GetAtt:
        - CreateProfileFunction
        - Arn

  CreateProfileFunctionName:
    Description: CreateProfile Lambda function name
    Value:
      Ref: CreateProfileFunction
