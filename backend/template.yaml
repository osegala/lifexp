      Description: Unequips a cosmetic from its server-controlled category slot.
      Layers:
        - Ref: ApiSharedLayer
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource:
                Fn::GetAtt:
                  - EvrenthiaDevTable
