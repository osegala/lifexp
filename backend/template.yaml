AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Description: Evrenthia backend for isolated environment stacks

# ======================================================
# PARAMETERS
# ======================================================

Parameters:
  EnvironmentName:
    Type: String
    Default: dev
    AllowedPattern: "^[a-z][a-z0-9-]*$"
    Description: Logical deployment environment name.

  FunctionNamePrefix:
    Type: String
    Default: Evrenthia-Dev
    Description: Physical resource prefix; the default preserves existing development names.

  LogRetentionDays:
    Type: Number
    Default: 14
    AllowedValues:
      - 1
      - 3
      - 5
      - 7
      - 14
      - 30
      - 60
      - 90
      - 120
      - 150
      - 180
      - 365
    Description: CloudWatch Logs retention period for this environment.

  PushDeliveryMode:
    Type: String
    Default: DRY_RUN
    AllowedValues:
      - DRY_RUN
      - LIVE
    Description: Notification delivery mode; DRY_RUN is the safe default for every environment.

  CognitoDeletionProtection:
    Type: String
    Default: INACTIVE
    AllowedValues:
      - ACTIVE
      - INACTIVE
    Description: Cognito user pool deletion protection; production should normally use ACTIVE.

  BudgetNotificationEmail:
    Type: String
    Default: ""
    AllowedPattern: '^$|^[^@\s]+@[^@\s]+\.[^@\s]+$'
    ConstraintDescription: Must be empty or a valid email address.
    Description: Optional email subscriber for this environment's account-wide budget alerts.

Conditions:
  HasBudgetNotificationEmail:
    Fn::Not:
      - Fn::Equals:
          - Ref: BudgetNotificationEmail
          - ""

# ======================================================
# GLOBAL LAMBDA SETTINGS
# ======================================================

Globals:
  Function:
    Runtime: nodejs22.x

    Architectures:
      - arm64

    MemorySize: 128

    Timeout: 10

    LoggingConfig:
      LogFormat: JSON
      ApplicationLogLevel: INFO
      SystemLogLevel: WARN

    Environment:
      Variables:
        ENVIRONMENT_NAME:
          Ref: EnvironmentName

        TABLE_NAME:
          Ref: EvrenthiaDevTable

# ======================================================
# RESOURCES
# ======================================================

Resources:
  # ----------------------------------------------------
  # ISOLATED ENVIRONMENT DATA AND IDENTITY
  # Logical IDs retain Dev for compatibility with the existing development stack.
  # ----------------------------------------------------

  EvrenthiaDevTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName:
        Ref: FunctionNamePrefix
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: NotificationDueIndex
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: KEYS_ONLY

  NotificationSharedLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName:
        Fn::Sub: "${FunctionNamePrefix}-NotificationShared"
      Description: Dependency-free timezone-aware notification scheduling helpers.
      ContentUri: layers/notification-shared/
      CompatibleRuntimes:
        - nodejs22.x
      RetentionPolicy: Retain

  ApiSharedLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName:
        Fn::Sub: "${FunctionNamePrefix}-ApiShared"
      Description: Canonical HTTP responses, JSON parsing, authentication extraction, and error handling.
      ContentUri: layers/api-shared/
      CompatibleRuntimes:
        - nodejs22.x
      RetentionPolicy: Retain

  ProgressionSharedLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName:
        Fn::Sub: "${FunctionNamePrefix}-ProgressionShared"
      Description: Server-authoritative building effects and catalog-driven achievement evaluation.
      ContentUri: layers/progression-shared/
      CompatibleRuntimes:
        - nodejs22.x
      RetentionPolicy: Retain

  # ----------------------------------------------------
  # LAMBDA LOG RETENTION
  # ----------------------------------------------------

  CreateProfileLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName:
        Fn::Sub: "/aws/lambda/${FunctionNamePrefix}-CreateProfile"
      RetentionInDays:
        Ref: LogRetentionDays

  GetMeLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName:
        Fn::Sub: "/aws/lambda/${FunctionNamePrefix}-GetMe"
      RetentionInDays:
        Ref: LogRetentionDays

  GetEntitlementsLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName:
        Fn::Sub: "/aws/lambda/${FunctionNamePrefix}-GetEntitlements"
      RetentionInDays:
        Ref: LogRetentionDays

  GetPreferencesLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName:
        Fn::Sub: "/aws/lambda/${FunctionNamePrefix}-GetPreferences"
      RetentionInDays:
        Ref: LogRetentionDays

  UpdatePreferencesLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName:
        Fn::Sub: "/aws/lambda/${FunctionNamePrefix}-UpdatePreferences"
      RetentionInDays:
        Ref: LogRetentionDays

  GetDevicesLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName:
        Fn::Sub: "/aws/lambda/${FunctionNamePrefix}-GetDevices"
      RetentionInDays:
        Ref: LogRetentionDays

  RegisterDeviceLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName:
        Fn::Sub: "/aws/lambda/${FunctionNamePrefix}-RegisterDevice"
      RetentionInDays:
        Ref: LogRetentionDays

  DisableDeviceLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName:
        Fn::Sub: "/aws/lambda/${FunctionNamePrefix}-DisableDevice"
      RetentionInDays:
        Ref: LogRetentionDays

  GetRemindersLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName:
        Fn::Sub: "/aws/lambda/${FunctionNamePrefix}-GetReminders"
      RetentionInDays:
        Ref: LogRetentionDays

  CreateReminderLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName:
        Fn::Sub: "/aws/lambda/${FunctionNamePrefix}-CreateReminder"
      RetentionInDays:
        Ref: LogRetentionDays

  UpdateReminderLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName:
        Fn::Sub: "/aws/lambda/${FunctionNamePrefix}-UpdateReminder"
      RetentionInDays:
        Ref: LogRetentionDays

  DeleteReminderLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName:
        Fn::Sub: "/aws/lambda/${FunctionNamePrefix}-DeleteReminder"
      RetentionInDays:
        Ref: LogRetentionDays

  NotificationWorkerLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName:
        Fn::Sub: "/aws/lambda/${FunctionNamePrefix}-NotificationWorker"
      RetentionInDays:
        Ref: LogRetentionDays

  GetTasksLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName:
        Fn::Sub: "/aws/lambda/${FunctionNamePrefix}-GetTasks"
      RetentionInDays:
        Ref: LogRetentionDays

  CreateTaskLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName:
        Fn::Sub: "/aws/lambda/${FunctionNamePrefix}-CreateTask"
      RetentionInDays:
        Ref: LogRetentionDays

  UpdateTaskLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName:
        Fn::Sub: "/aws/lambda/${FunctionNamePrefix}-UpdateTask"
      RetentionInDays:
        Ref: LogRetentionDays

  DeleteTaskLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName:
        Fn::Sub: "/aws/lambda/${FunctionNamePrefix}-DeleteTask"
      RetentionInDays:
        Ref: LogRetentionDays

  CompleteTaskLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName:
        Fn::Sub: "/aws/lambda/${FunctionNamePrefix}-CompleteTask"
      RetentionInDays:
        Ref: LogRetentionDays

  GetGoalsLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName:
        Fn::Sub: "/aws/lambda/${FunctionNamePrefix}-GetGoals"
      RetentionInDays:
        Ref: LogRetentionDays

  GetHistoryLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName:
        Fn::Sub: "/aws/lambda/${FunctionNamePrefix}-GetHistory"
      RetentionInDays:
        Ref: LogRetentionDays

  GetCompletionHistoryLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName:
        Fn::Sub: "/aws/lambda/${FunctionNamePrefix}-GetCompletionHistory"
      RetentionInDays:
        Ref: LogRetentionDays

  GetAchievementsLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName:
        Fn::Sub: "/aws/lambda/${FunctionNamePrefix}-GetAchievements"
      RetentionInDays:
        Ref: LogRetentionDays

  GetWorldLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName:
        Fn::Sub: "/aws/lambda/${FunctionNamePrefix}-GetWorld"
      RetentionInDays:
        Ref: LogRetentionDays

  UpgradeBuildingLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName:
        Fn::Sub: "/aws/lambda/${FunctionNamePrefix}-UpgradeBuilding"
      RetentionInDays:
        Ref: LogRetentionDays

  GetShopLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName:
        Fn::Sub: "/aws/lambda/${FunctionNamePrefix}-GetShop"
      RetentionInDays:
        Ref: LogRetentionDays

  PurchaseItemLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName:
        Fn::Sub: "/aws/lambda/${FunctionNamePrefix}-PurchaseItem"
      RetentionInDays:
        Ref: LogRetentionDays

  GetInventoryLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName:
        Fn::Sub: "/aws/lambda/${FunctionNamePrefix}-GetInventory"
      RetentionInDays:
        Ref: LogRetentionDays

  EquipItemLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName:
        Fn::Sub: "/aws/lambda/${FunctionNamePrefix}-EquipItem"
      RetentionInDays:
        Ref: LogRetentionDays

  UnequipItemLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName:
        Fn::Sub: "/aws/lambda/${FunctionNamePrefix}-UnequipItem"
      RetentionInDays:
        Ref: LogRetentionDays

  UpdateMeLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName:
        Fn::Sub: "/aws/lambda/${FunctionNamePrefix}-UpdateMe"
      RetentionInDays:
        Ref: LogRetentionDays

  DeleteAccountLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName:
        Fn::Sub: "/aws/lambda/${FunctionNamePrefix}-DeleteAccount"
      RetentionInDays:
        Ref: LogRetentionDays

  EvrenthiaDevUserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName:
        Fn::Sub: "${FunctionNamePrefix}-Users"
      DeletionProtection:
        Ref: CognitoDeletionProtection
      UsernameAttributes:
        - email
      UsernameConfiguration:
        CaseSensitive: false
      AutoVerifiedAttributes:
        - email
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      Schema:
        - Name: email
          AttributeDataType: String
          Mutable: true
          Required: true
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          RequireUppercase: true
          TemporaryPasswordValidityDays: 7
      LambdaConfig:
        PostConfirmation:
          Fn::GetAtt:
            - CreateProfileFunction
            - Arn

  EvrenthiaDevUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName:
        Fn::Sub: "${FunctionNamePrefix}-Mobile"
      UserPoolId:
        Ref: EvrenthiaDevUserPool
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      SupportedIdentityProviders:
        - COGNITO

  # ----------------------------------------------------
  # COGNITO POST-CONFIRMATION PROFILE CREATION
  # ----------------------------------------------------

  CreateProfileFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: "${FunctionNamePrefix}-CreateProfile"
      CodeUri: functions/create-profile/
      Handler: index.handler
      Description: Creates a default player profile after Cognito confirmation.
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
              Resource:
                Fn::GetAtt:
                  - EvrenthiaDevTable
                  - Arn

  CreateProfileInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName:
        Ref: CreateProfileFunction
      Principal: cognito-idp.amazonaws.com
      SourceAccount:
        Ref: AWS::AccountId
      SourceArn:
        Fn::GetAtt:
          - EvrenthiaDevUserPool
          - Arn

  # ----------------------------------------------------
  # HTTP API
  # ----------------------------------------------------

  EvrenthiaDevApi:
    Type: AWS::Serverless::HttpApi

    Properties:
      StageName: "$default"

      CorsConfiguration:
        AllowOrigins:
          - "*"

        AllowHeaders:
          - Authorization
          - Content-Type

        AllowMethods:
          - GET
          - POST
          - PATCH
          - DELETE
          - OPTIONS

      Auth:
        Authorizers:
          EvrenthiaCognito:
            JwtConfiguration:
              issuer:
                Fn::Sub:
                  - "https://cognito-idp.${AWS::Region}.amazonaws.com/${PoolId}"
                  - PoolId:
                      Ref: EvrenthiaDevUserPool

              audience:
                - Ref: EvrenthiaDevUserPoolClient

            IdentitySource: "$request.header.Authorization"

  # ----------------------------------------------------
  # GET /me
  # ----------------------------------------------------

  GetMeFunction:
    Type: AWS::Serverless::Function

    Properties:
      FunctionName:
        Fn::Sub: "${FunctionNamePrefix}-GetMe"

      CodeUri: functions/get-me/

      Handler: index.handler

      Description: Retrieves the authenticated Evrenthia player profile.

      Layers:
        - Ref: ApiSharedLayer

      Policies:
        - Version: "2012-10-17"

          Statement:
            - Effect: Allow

              Action:
                - dynamodb:GetItem

              Resource:
                Fn::GetAtt:
                  - EvrenthiaDevTable
                  - Arn

      Events:
        GetMe:
          Type: HttpApi

          Properties:
            ApiId:
              Ref: EvrenthiaDevApi

            Path: /me

            Method: GET

            Auth:
              Authorizer: EvrenthiaCognito

  # ----------------------------------------------------
  # GET /entitlements
  # ----------------------------------------------------

  GetEntitlementsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: "${FunctionNamePrefix}-GetEntitlements"
      CodeUri: functions/get-entitlements/
      Handler: index.handler
      Description: Retrieves the authenticated player's effective subscription and ad entitlement.
      Layers:
        - Ref: ApiSharedLayer
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
              Resource:
                Fn::GetAtt:
                  - EvrenthiaDevTable
                  - Arn
      Events:
        GetEntitlements:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: EvrenthiaDevApi
            Path: /entitlements
            Method: GET
            Auth:
              Authorizer: EvrenthiaCognito

  # ----------------------------------------------------
  # PREFERENCES
  # ----------------------------------------------------

  GetPreferencesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: "${FunctionNamePrefix}-GetPreferences"
      CodeUri: functions/preferences/
      Handler: get.handler
      Description: Retrieves resolved notification and experience preferences.
      Layers:
        - Ref: ApiSharedLayer
        - Ref: NotificationSharedLayer
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
              Resource:
                Fn::GetAtt:
                  - EvrenthiaDevTable
                  - Arn
      Events:
        GetPreferences:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: EvrenthiaDevApi
            Path: /preferences
            Method: GET
            Auth:
              Authorizer: EvrenthiaCognito

  UpdatePreferencesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: "${FunctionNamePrefix}-UpdatePreferences"
      CodeUri: functions/preferences/
      Handler: update.handler
      Description: Updates editable notification and experience preferences.
      Layers:
        - Ref: ApiSharedLayer
        - Ref: NotificationSharedLayer
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource:
                Fn::GetAtt:
                  - EvrenthiaDevTable
                  - Arn
      Events:
        UpdatePreferences:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: EvrenthiaDevApi
            Path: /preferences
            Method: PATCH
            Auth:
              Authorizer: EvrenthiaCognito

  # ----------------------------------------------------
  # PUSH DEVICES
  # ----------------------------------------------------

  GetDevicesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: "${FunctionNamePrefix}-GetDevices"
      CodeUri: functions/devices/
      Handler: get.handler
      Description: Retrieves registered devices without exposing push tokens.
      Layers:
        - Ref: ApiSharedLayer
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:Query
              Resource:
                Fn::GetAtt:
                  - EvrenthiaDevTable
                  - Arn
      Events:
        GetDevices:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: EvrenthiaDevApi
            Path: /devices
            Method: GET
            Auth:
              Authorizer: EvrenthiaCognito

  RegisterDeviceFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: "${FunctionNamePrefix}-RegisterDevice"
      CodeUri: functions/devices/
      Handler: register.handler
      Description: Registers or refreshes an Expo push device.
      Layers:
        - Ref: ApiSharedLayer
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:UpdateItem
              Resource:
                Fn::GetAtt:
                  - EvrenthiaDevTable
                  - Arn
      Events:
        RegisterDevice:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: EvrenthiaDevApi
            Path: /devices
            Method: POST
            Auth:
              Authorizer: EvrenthiaCognito

  DisableDeviceFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: "${FunctionNamePrefix}-DisableDevice"
      CodeUri: functions/devices/
      Handler: disable.handler
      Description: Soft-disables a registered push device.
      Layers:
        - Ref: ApiSharedLayer
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:UpdateItem
              Resource:
                Fn::GetAtt:
                  - EvrenthiaDevTable
                  - Arn
      Events:
        DisableDevice:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: EvrenthiaDevApi
            Path: /devices/{deviceId}
            Method: DELETE
            Auth:
              Authorizer: EvrenthiaCognito

  # ----------------------------------------------------
  # REMINDER CONFIGURATION
  # ----------------------------------------------------

  GetRemindersFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: "${FunctionNamePrefix}-GetReminders"
      CodeUri: functions/reminders/
      Handler: get.handler
      Description: Retrieves reminder configuration and effective delivery eligibility.
      Layers:
        - Ref: ApiSharedLayer
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Query
              Resource:
                Fn::GetAtt:
                  - EvrenthiaDevTable
                  - Arn
      Events:
        GetReminders:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: EvrenthiaDevApi
            Path: /reminders
            Method: GET
            Auth:
              Authorizer: EvrenthiaCognito

  CreateReminderFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: "${FunctionNamePrefix}-CreateReminder"
      CodeUri: functions/reminders/
      Handler: create.handler
      Description: Creates an idempotent task reminder configuration.
      Layers:
        - Ref: ApiSharedLayer
        - Ref: NotificationSharedLayer
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
              Resource:
                Fn::GetAtt:
                  - EvrenthiaDevTable
                  - Arn
      Events:
        CreateReminder:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: EvrenthiaDevApi
            Path: /reminders
            Method: POST
            Auth:
              Authorizer: EvrenthiaCognito

  UpdateReminderFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: "${FunctionNamePrefix}-UpdateReminder"
      CodeUri: functions/reminders/
      Handler: update.handler
      Description: Updates editable reminder configuration.
      Layers:
        - Ref: ApiSharedLayer
        - Ref: NotificationSharedLayer
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource:
                Fn::GetAtt:
                  - EvrenthiaDevTable
                  - Arn
      Events:
        UpdateReminder:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: EvrenthiaDevApi
            Path: /reminders/{reminderId}
            Method: PATCH
            Auth:
              Authorizer: EvrenthiaCognito

  DeleteReminderFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: "${FunctionNamePrefix}-DeleteReminder"
      CodeUri: functions/reminders/
      Handler: disable.handler
      Description: Soft-disables a reminder configuration.
      Layers:
        - Ref: ApiSharedLayer
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:UpdateItem
              Resource:
                Fn::GetAtt:
                  - EvrenthiaDevTable
                  - Arn
      Events:
        DeleteReminder:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: EvrenthiaDevApi
            Path: /reminders/{reminderId}
            Method: DELETE
            Auth:
              Authorizer: EvrenthiaCognito

  NotificationWorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: "${FunctionNamePrefix}-NotificationWorker"
      CodeUri: functions/notification-worker/
      Handler: index.handler
      Description: Claims due notification configurations and prepares or delivers push attempts.
      Timeout: 30
      Layers:
        - Ref: NotificationSharedLayer
      Environment:
        Variables:
          PUSH_DELIVERY_MODE:
            Ref: PushDeliveryMode
          NOTIFICATION_BATCH_SIZE: "25"
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:Query
              Resource:
                - Fn::GetAtt:
                    - EvrenthiaDevTable
                    - Arn
                - Fn::Sub:
                    - "${TableArn}/index/NotificationDueIndex"
                    - TableArn:
                        Fn::GetAtt:
                          - EvrenthiaDevTable
                          - Arn
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource:
                Fn::GetAtt:
                  - EvrenthiaDevTable
                  - Arn
      Events:
        NotificationWorkerSchedule:
          Type: Schedule
          Properties:
            Name:
              Fn::Sub: "${FunctionNamePrefix}-NotificationWorker-EveryMinute"
            Description: Notification worker tick for this isolated Evrenthia environment.
            Schedule: rate(1 minute)
            Enabled: true

  # ----------------------------------------------------
  # TASKS
  # ----------------------------------------------------

  GetTasksFunction:
    Type: AWS::Serverless::Function

    Properties:
      FunctionName:
        Fn::Sub: "${FunctionNamePrefix}-GetTasks"
      CodeUri: functions/get-tasks/
      Handler: index.handler
      Description: Retrieves the authenticated player's tasks.

      Layers:
        - Ref: ApiSharedLayer

      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Query
              Resource:
                Fn::GetAtt:
                  - EvrenthiaDevTable
                  - Arn

      Events:
        GetTasks:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: EvrenthiaDevApi
            Path: /tasks
            Method: GET
            Auth:
              Authorizer: EvrenthiaCognito

  CreateTaskFunction:
    Type: AWS::Serverless::Function

    Properties:
      FunctionName:
        Fn::Sub: "${FunctionNamePrefix}-CreateTask"
      CodeUri: functions/create-task/
      Handler: index.handler
      Description: Creates a task for the authenticated player.

      Layers:
        - Ref: ApiSharedLayer

      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
              Resource:
                Fn::GetAtt:
                  - EvrenthiaDevTable
                  - Arn

      Events:
        CreateTask:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: EvrenthiaDevApi
            Path: /tasks
            Method: POST
            Auth:
              Authorizer: EvrenthiaCognito

  UpdateTaskFunction:
    Type: AWS::Serverless::Function

    Properties:
      FunctionName:
        Fn::Sub: "${FunctionNamePrefix}-UpdateTask"
      CodeUri: functions/update-task/
      Handler: index.handler
      Description: Updates editable task fields for the authenticated player.

      Layers:
        - Ref: ApiSharedLayer

      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource:
                Fn::GetAtt:
                  - EvrenthiaDevTable
                  - Arn

      Events:
        UpdateTask:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: EvrenthiaDevApi
            Path: /tasks/{taskId}
            Method: PATCH
            Auth:
              Authorizer: EvrenthiaCognito

  DeleteTaskFunction:
    Type: AWS::Serverless::Function

    Properties:
      FunctionName:
        Fn::Sub: "${FunctionNamePrefix}-DeleteTask"
      CodeUri: functions/delete-task/
      Handler: index.handler
      Description: Archives a task owned by the authenticated player.

      Layers:
        - Ref: ApiSharedLayer

      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:UpdateItem
              Resource:
                Fn::GetAtt:
                  - EvrenthiaDevTable
                  - Arn

      Events:
        DeleteTask:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: EvrenthiaDevApi
            Path: /tasks/{taskId}
            Method: DELETE
            Auth:
              Authorizer: EvrenthiaCognito

  CompleteTaskFunction:
    Type: AWS::Serverless::Function

    Properties:
      FunctionName:
        Fn::Sub: "${FunctionNamePrefix}-CompleteTask"
      CodeUri: functions/complete-task/
      Handler: index.handler
      Description: Completes a task and atomically applies player progression.

      Layers:
        - Ref: ApiSharedLayer
        - Ref: ProgressionSharedLayer

      Environment:
        Variables:
          DEFAULT_TASK_XP: "10"
          DEFAULT_TASK_COINS: "1"
          DAILY_TASK_TARGET: "3"
          WEEKLY_TASK_TARGET: "15"
          DAILY_WORLD_POINTS_REWARD: "25"
          WEEKLY_WORLD_POINTS_REWARD: "100"

      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Query
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource:
                Fn::GetAtt:
                  - EvrenthiaDevTable
                  - Arn

      Events:
        CompleteTask:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: EvrenthiaDevApi
            Path: /tasks/{taskId}/complete
            Method: POST
            Auth:
              Authorizer: EvrenthiaCognito

